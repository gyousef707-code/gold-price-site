<title>ذهبي - تطبيق اسعار الذهب والفضة</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg-color: #0d1117;
    --card-bg: #161b22;
    --card-bg-elevated: #1c2128;
    --text-color: #f0f6fc;
    --text-muted: #8b949e;
    --gold-primary: #e3b341;
    --gold-bright: #f0c040;
    --gold-dark: #b8860b;
    --border-gold: rgba(227, 179, 65, 0.25);
    --border-subtle: rgba(255,255,255,0.06);
    --success: #3fb950;
    --danger: #f85149;
    --warning: #d29922;
    --info: #58a6ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: 'Cairo', sans-serif;
    margin: 0;
    padding-bottom: 70px;
    direction: rtl;
    overflow-x: hidden;
}
body.light-mode {
    --bg-color: #f6f8fa;
    --card-bg: #ffffff;
    --card-bg-elevated: #f3f4f6;
    --text-color: #1f2328;
    --text-muted: #656d76;
    --border-gold: rgba(184, 134, 11, 0.2);
    --border-subtle: rgba(0,0,0,0.06);
}
body.light-mode .p-value.buy-v, body.light-mode .buy-v { color: #333; }
body.light-mode .p-label { color: #656d76; }
body.light-mode .carat-title-top { color: #656d76; }
body.light-mode .sub-card-title { color: #656d76; }
body.light-mode .sub-card-unit { color: #8c959f; }
body.light-mode .md-title { color: #656d76; }
body.light-mode .gap-label-top { color: #656d76; }
body.light-mode .ounce-header { color: #656d76; }
body.light-mode .ounce-footer { color: #8c959f; }
body.light-mode .news-item h3 { color: #1f2328; }
body.light-mode .news-source { color: #656d76; }
body.light-mode .nav-item { color: #656d76; }
body.light-mode .carat-col { border-left-color: rgba(0,0,0,0.06); }
body.light-mode .mini-dollar-box { background: rgba(0,0,0,0.02); border-color: rgba(0,0,0,0.06); }
body.light-mode .news-item { border-color: rgba(0,0,0,0.06); }
body.light-mode .gap-circle-inner { background: #f6f8fa; }
body.light-mode .carats-box-main { background: linear-gradient(145deg, #ffffff 0%, #f3f4f6 100%); }
body.light-mode .ounce-card { background: linear-gradient(145deg, #ffffff 0%, #f3f4f6 100%); }
body.light-mode .icon-btn { background: #eaeef2; }
body.light-mode .drawer { background: #ffffff; }
body.light-mode .drawer-item { color: #1f2328; }
body.light-mode .drawer-item:hover { background: #f3f4f6; }
body.light-mode .calc-input { background: #ffffff; border-color: #d0d7de; color: #1f2328; }
body.light-mode .calc-result-box { background: #f6f8fa; }
body.light-mode .notification-item { background: #ffffff; border-color: rgba(0,0,0,0.06); }
body.light-mode .currency-row { background: #ffffff; border-color: rgba(0,0,0,0.06); }
body.light-mode .currency-row:hover { background: #f3f4f6; }
body.light-mode .period-btn { color: #656d76; }
body.light-mode .period-btn.active { color: var(--gold-primary); background: rgba(227,179,65,0.1); }
body.light-mode .bottom-nav { background: linear-gradient(180deg, rgba(246,248,250,0.95) 0%, #ffffff 100%); }
body.light-mode .gold-card { background: linear-gradient(145deg, #ffffff 0%, #f3f4f6 100%); }
body.light-mode .tool-card { background: linear-gradient(145deg, #ffffff 0%, #f3f4f6 100%); }
body.light-mode .tool-card h3 { color: #1f2328; }
body.light-mode .tool-card p { color: #656d76; }
body.light-mode .silver-card { background: linear-gradient(145deg, #ffffff 0%, #f3f4f6 100%); }
body.light-mode .currency-card-new { background: #ffffff; border-color: rgba(0,0,0,0.08); }
body.light-mode .currency-card-new:hover { border-color: var(--border-gold); }
body.light-mode .currency-card-flag { background: #f3f4f6; border-color: rgba(0,0,0,0.08); }
body.light-mode .converter-box { background: #ffffff; }
body.light-mode .converter-row { background: #f6f8fa; border-color: rgba(0,0,0,0.08); }
body.light-mode .converter-input { color: #1f2328; }

/* SPLASH SCREEN */
#splash-screen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
    transition: opacity 0.6s ease, visibility 0.6s ease;
}
#splash-screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}
.splash-bg {
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle at 50% 50%, rgba(227,179,65,0.08) 0%, transparent 50%);
    animation: splashPulse 3s ease-in-out infinite;
}
@keyframes splashPulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.1); opacity: 1; }
}
.splash-content {
    position: relative;
    z-index: 1;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
}
.splash-icon {
    animation: splashIconIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    opacity: 0;
    transform: scale(0.5);
}
@keyframes splashIconIn {
    to { opacity: 1; transform: scale(1); }
}
.splash-title {
    font-size: 36px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--gold-primary) 0%, var(--gold-bright) 50%, var(--gold-dark) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 0;
    letter-spacing: 2px;
    animation: splashFadeUp 0.6s 0.3s ease forwards;
    opacity: 0;
    transform: translateY(20px);
}
.splash-subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0;
    animation: splashFadeUp 0.6s 0.5s ease forwards;
    opacity: 0;
    transform: translateY(20px);
}
@keyframes splashFadeUp {
    to { opacity: 1; transform: translateY(0); }
}
.splash-loader {
    width: 120px;
    height: 3px;
    background: var(--border-subtle);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 16px;
    animation: splashFadeUp 0.6s 0.7s ease forwards;
    opacity: 0;
}
.splash-loader-bar {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, var(--gold-primary), var(--gold-bright));
    border-radius: 3px;
    animation: splashLoad 2s 0.8s ease-in-out forwards;
}
@keyframes splashLoad {
    0% { width: 0%; }
    60% { width: 70%; }
    100% { width: 100%; }
}

.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    background: linear-gradient(180deg, var(--card-bg) 0%, rgba(22,27,34,0.95) 100%);
    border-bottom: 1px solid var(--border-gold);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
}
.header-left { display: flex; gap: 10px; align-items: center; }
.header-right { display: flex; align-items: center; gap: 12px; }
.icon-btn {
    width: 40px; height: 40px;
    border-radius: 12px;
    border: 1px solid var(--border-gold);
    background: var(--card-bg-elevated);
    color: var(--gold-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 15px;
}
.icon-btn:hover {
    background: var(--gold-primary);
    color: #000;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(227,179,65,0.3);
}
.logo-text {
    font-size: 24px;
    background: linear-gradient(135deg, var(--gold-primary) 0%, var(--gold-bright) 50%, var(--gold-dark) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 0;
    font-weight: 800;
    letter-spacing: -0.5px;
}
.logo-dot {
    color: var(--danger);
    -webkit-text-fill-color: var(--danger);
    animation: pulse-dot 2s infinite;
}
@keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}
.main-content {
    padding: 14px;
    max-width: 600px;
    margin: 0 auto;
}

/* DRAWER */
.drawer-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
}
.drawer-overlay.active { opacity: 1; visibility: visible; }
.drawer {
    position: fixed; top: 0; right: -280px;
    width: 280px; height: 100vh;
    background: var(--card-bg);
    z-index: 201;
    transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    border-left: 1px solid var(--border-gold);
    display: flex;
    flex-direction: column;
}
.drawer.active { right: 0; }
.drawer-header {
    padding: 20px;
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.drawer-header h2 {
    font-size: 20px;
    background: linear-gradient(135deg, var(--gold-primary), var(--gold-bright));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 800;
}
.drawer-close {
    width: 36px; height: 36px;
    border-radius: 10px;
    border: 1px solid var(--border-subtle);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.3s;
}
.drawer-close:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
.drawer-body { flex: 1; overflow-y: auto; padding: 8px 0; }
.drawer-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    color: var(--text-color);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: 0.2s;
    cursor: pointer;
    border: none;
    background: none;
    width: 100%;
    font-family: 'Cairo', sans-serif;
}
.drawer-item:hover { background: var(--card-bg-elevated); }
.drawer-item i { width: 22px; text-align: center; color: var(--gold-primary); font-size: 16px; }

/* SECTIONS */
.section { display: none; animation: fadeIn 0.3s ease; }
.section.active { display: block; }
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

/* OUNCE CARD */
.global-ounce-section { margin-bottom: 14px; }
.ounce-card {
    background: linear-gradient(145deg, var(--card-bg) 0%, var(--card-bg-elevated) 100%);
    border: 1px solid var(--border-gold);
    border-radius: 18px;
    padding: 18px;
    position: relative;
    overflow: hidden;
}
.ounce-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 10px;
}
.ounce-price {
    font-size: 32px;
    font-weight: 800;
    color: var(--gold-bright);
    margin: 6px 0;
}

/* GOLD CARDS GRID */
.gold-cards-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 10px;
}
.gold-card {
    background: linear-gradient(145deg, var(--card-bg) 0%, rgba(22,27,34,0.9) 100%);
    border: 1px solid var(--border-gold);
    border-radius: 16px;
    padding: 12px 6px;
    text-align: center;
}
.gold-carat-num { font-size: 22px; font-weight: 800; color: var(--gold-bright); }
.gold-v-value { font-size: 13px; font-weight: 800; }
.sell-price { color: var(--success); }
.buy-price { color: var(--danger); }

/* SUB CARDS ROW */
.sub-cards-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 10px;
}
.sub-card {
    background: var(--card-bg);
    border: 1px solid var(--border-gold);
    border-radius: 10px;
    padding: 8px 2px;
    text-align: center;
}
.sub-card-val { font-size: 12px; font-weight: 700; color: var(--gold-bright); }

/* BOTTOM NAV */
.bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, rgba(13,17,23,0.95) 0%, var(--card-bg) 100%);
    display: flex;
    justify-content: space-around;
    padding: 8px 0 12px;
    border-top: 1px solid var(--border-gold);
    z-index: 100;
}
.nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--text-muted);
    font-size: 10px;
    cursor: pointer;
    border: none;
    background: none;
}
.nav-item.active { color: var(--gold-primary); }

@media (max-width: 400px) {
    .gold-cards-grid { gap: 8px; }
    .gold-card { padding: 8px 4px; border-radius: 12px; }
    .gold-carat-num { font-size: 18px; }
    .gold-v-value { font-size: 11px; }
}
</style>
</head>
<body>

<!-- SPLASH SCREEN -->
<div id="splash-screen">
    <div class="splash-bg"></div>
    <div class="splash-content">
        <div class="splash-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="48" fill="#e3b341" stroke="#161b22" stroke-width="3"/>
                <text x="50" y="62" font-size="30" text-anchor="middle" fill="#0d1117" font-family="Cairo" font-weight="800">ذهبي</text>
            </svg>
        </div>
        <h1 class="splash-title">ذهـبـي</h1>
        <p class="splash-subtitle">أسعار الذهب والعملات لحظة بلحظة</p>
        <div class="splash-loader"><div class="splash-loader-bar"></div></div>
    </div>
</div>

<!-- HEADER -->
<header class="app-header">
    <div class="header-right">
        <h1 class="logo-text">ذهبي<span class="logo-dot">•</span></h1>
    </div>
    <div class="header-left">
        <button class="icon-btn" id="theme-toggle" title="تغيير المظهر"><i class="fa-solid fa-moon"></i></button>
        <button class="icon-btn" id="menu-btn" title="القائمة"><i class="fa-solid fa-bars"></i></button>
    </div>
</header>

<!-- MAIN CONTENT -->
<main class="main-content">
    <section id="gold-section" class="section active">
        <!-- الأونصة العالمية -->
        <div class="global-ounce-section">
            <div class="ounce-card">
                <div class="ounce-header">
                    <span>الأونصة العالمية</span>
                    <span class="badge-change positive">+0.4%</span>
                </div>
                <div class="ounce-price" id="ounce-val">$0.00</div>
            </div>
        </div>

        <!-- كروت عيارات الذهب -->
        <div class="gold-cards-grid">
            <div class="gold-card">
                <div class="gold-carat-num">24</div>
                <div class="gold-v-row"><span class="gold-v-value sell-price" id="k24-sell">0</span></div>
                <div class="gold-v-row"><span class="gold-v-value buy-price" id="k24-buy">0</span></div>
            </div>
            <div class="gold-card featured">
                <div class="gold-carat-num">21</div>
                <div class="gold-v-row"><span class="gold-v-value sell-price" id="k21-sell">0</span></div>
                <div class="gold-v-row"><span class="gold-v-value buy-price" id="k21-buy">0</span></div>
            </div>
            <div class="gold-card">
                <div class="gold-carat-num">18</div>
                <div class="gold-v-row"><span class="gold-v-value sell-price" id="k18-sell">0</span></div>
                <div class="gold-v-row"><span class="gold-v-value buy-price" id="k18-buy">0</span></div>
            </div>
            <div class="gold-card">
                <div class="gold-carat-num">14</div>
                <div class="gold-v-row"><span class="gold-v-value sell-price" id="k14-sell">0</span></div>
                <div class="gold-v-row"><span class="gold-v-value buy-price" id="k14-buy">0</span></div>

            <div class="sub-card">
                <span class="sub-card-title">سبيكة 10 جرام</span>
                <span class="sub-card-val" id="bar10-sell">0</span>

            <div class="sub-card">
                <span class="sub-card-title">سبيكة 100 جرام</span>
                <span class="sub-card-val" id="bar100-sell">0</span>
            </div>

<!-- BOTTOM NAVIGATION -->
<nav class="bottom-nav">
    <button class="nav-item active"><i class="fa-solid fa-coins"></i><span>الذهب</span></button>
    <button class="nav-item"><i class="fa-solid fa-dollar-sign"></i><span>العملات</span></button>
    <button class="nav-item"><i class="fa-solid fa-calculator"></i><span>الحاسبة</span></button>
</nav>

<!-- JAVASCRIPT FETCH INTEGRATION -->
<script>
// إخفاء الـ Splash Screen بعد التحميل
window.addEventListener('load', () => {
    setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        if (splash) splash.classList.add('hidden');
    }, 1200);
});

// دالة تحديث الأسعار المباشرة عبر API
async function fetchEgyptianGoldPrices() {
    try {
        const response = await fetch('/api/gold-price');
        const data = await response.json();

        if (!data || !data.prices) return;

        // تحديث عيارات الذهب 24، 21، 18، 14
        const carats = [24, 21, 18, 14];
        carats.forEach(carat => {
            if (data.prices[carat]) {
                const sellElem = document.getElementById(`k${carat}-sell`);
                const buyElem = document.getElementById(`k${carat}-buy`);
                if (sellElem) sellElem.innerText = data.prices[carat].sell;
                if (buyElem) buyElem.innerText = data.prices[carat].buy;
            }
        });

        // تحديث الجنيه الذهب والأونصة
        if (data.pound && document.getElementById('pound-sell')) {
            document.getElementById('pound-sell').innerText = data.pound.sell;
        }
        if (data.ounce && document.getElementById('ounce-val')) {
            document.getElementById('ounce-val').innerText = `$${data.ounce.sell}`;
        }
    } catch (error) {
        console.error("خطأ في تحديث أسعار الذهب:", error);
    }
}

// التشغيل الفوري والربط بالتحديث التلقائي
document.addEventListener('DOMContentLoaded', () => {
    fetchEgyptianGoldPrices();
    setInterval(fetchEgyptianGoldPrices, 60000);
});
</script>
